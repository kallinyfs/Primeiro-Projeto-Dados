<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="title desc">
  <title id="title">Logo Brasa &amp; Pão</title>
  <desc id="desc">Selo ilustrado com hambúrguer artesanal e chamas</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#3d2b24" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect x="5" y="5" width="150" height="110" rx="28" fill="#fffdf8" stroke="#3d2b24" stroke-width="3"/>
  <rect x="12" y="12" width="136" height="96" rx="22" fill="none" stroke="#f4dc8a" stroke-width="2"/>

  <!-- Chamas atrás do hambúrguer -->
  <path d="M54 47c-8-10-3-18 5-25-1 9 4 12 8 15-1-12 7-19 15-27-2 14 4 19 9 26 4-8 10-12 17-14-4 11-1 18 6 25" fill="#e98b55" stroke="#3d2b24" stroke-width="3" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M67 46c-4-7-1-12 4-17 0 6 3 8 6 11 0-7 4-11 8-15-1 8 3 12 6 16 2-5 5-8 9-9-2 8 1 12 4 16" fill="#f0d487" stroke="#3d2b24" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Hambúrguer principal -->
  <g filter="url(#shadow)">
    <path d="M31 58c2-15 17-24 49-24s47 9 49 24H31z" fill="#c85d4d" stroke="#3d2b24" stroke-width="4" stroke-linejoin="round"/>
    <path d="M51 45l3-4m12 2 2-5m14 5 3-4m13 8 3-3m-57 1 2-3" fill="none" stroke="#fffdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M28 62c8 8 15-2 24 4s16-4 25 2 16-4 25 2 16-3 30 2" fill="none" stroke="#f4dc8a" stroke-width="9" stroke-linecap="round"/>
    <path d="M30 75c7 5 14 1 21 1h58c8 0 14 4 21-1" fill="none" stroke="#9a775e" stroke-width="10" stroke-linecap="round"/>
    <path d="M31 87h98" stroke="#3d2b24" stroke-width="13" stroke-linecap="round"/>
    <path d="M38 101c12 5 72 5 84 0" fill="none" stroke="#c85d4d" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Detalhes de destaque -->
  <path d="M19 33h8m-4-4v8M133 33h8m-4-4v8" stroke="#c85d4d" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M18 91h8m-4-4v8M134 91h8m-4-4v8" stroke="#f4dc8a" stroke-width="2.5" stroke-linecap="round"/>
</svg>
